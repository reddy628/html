<h1>Form</h1>

    <fieldset>
        <legend>Registration Form</legend>
        <center>
            <form action="#" method="get">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your Name">
                <br>
                <label for="email">Email</label>
                <input type="email"  id="email">
                <br>
                <label for="Password">Password</label>
                <input type="password"  id="Password">
                <br>
                <label for="phno">Phno</label>
                <input type="tel" id="phno" value="+91">
                <br>
                <label for="age">Age</label>
                <input type="number"  id="age">
                <br>
                <label for="Adress">Adress</label>
                <br>
                <textarea id="Adress" cols="30" rows="10"></textarea>
                <br>
                <label for="gender">Gender</label>
                <input type="radio"  id="gender" name="gender" value="male">Male
                <input type="radio"  id="gender" name="gender" value="female">Female
                <br>
                <label for="Course">Course</label>
                <input type="checkbox" name="Course" id="Course" value="WT">WT
                <input type="checkbox" name="Course" id="Course" value="MT">MT
                <input type="checkbox" name="Course" id="Course" value="SQL">SQL
                <input type="checkbox" name="Course" id="Course" value="JAVA">JAVA
                <br>
                <label for="Branch">Branch</label>
                <select name="Branch" id="Branch">
                   <optgroup label="Pune">
                    <option value=""></option>
                    <option value="java">java</option>
                    <option value="python">python</option>
                    <option value="testing">testing</option>
                   </optgroup>
                </select>
                <br>
                <label for="DOB">DOB</label>
                <input type="datetime-local"  id="DOB">
                <br>
                <label for="File">File</label>
                <input type="file"  id="File">
                <br>
                <label for="image">Image</label>
                <input type="file"  id="image" accept="image/*">
                <br>
                <input type="submit" value="submit">
                <input type="reset" value="Reset">
            </form>
        </center>
    </fieldset>
